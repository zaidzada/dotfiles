# -----------------------------------------------------------------------------
# > General settings
# -----------------------------------------------------------------------------

# Use non-login shells when creating windows/panels
# set -g default-command "${SHELL}" -- commenting out because maybe it doesn't make sense

set -g base-index 1
set -g pane-base-index 1

set -g default-terminal "xterm-256color"
set -s terminal-features[10] 'xterm-256color:RGB'  # fixed index so reloads don't append duplicates

set -s escape-time 10
set -g repeat-time 500
set -g display-time 1000

setw -g mode-keys vi
set -g history-limit 10000

set -g focus-events on
set -g visual-activity on
setw -g monitor-activity on

set -g set-titles on
set -g set-titles-string "#I:#W"

set -g mouse on

# -----------------------------------------------------------------------------
# > Key bindings
# -----------------------------------------------------------------------------

set-option -g prefix \;

# Copy paste
bind [ copy-mode
bind ] paste-buffer
bind v copy-mode
bind i paste-buffer
set -s copy-command 'pbcopy'

# Misc
unbind d
bind \; send-prefix
bind K kill-pane
bind D detach-client
bind : command-prompt
bind r source-file ~/.config/tmux/tmux.conf\; display "Reloaded .tmux.conf"
bind Q confirm-before -p "kill-session #S? (y/n)" kill-session
bind C-l send-keys -R \; clear-history
bind R move-window -r
bind F command-prompt "find-window -Z -- '%%'"
bind e split-window -hb -l 35 -c "#{pane_current_path}" "sbar"

# Navigation
bind -r k previous-window
bind -r j next-window
bind -r z resize-pane -Z
bind L last-window
# if window is zoomed or no panes, then switch window
bind l if-shell 'test #{window_zoomed_flag} -eq 1 -o #{window_panes} -eq 1' \
    'last-window' \
    'last-pane'


# Splitting
bind c new-window -c "#{pane_current_path}"
bind a new-window -ac "#{pane_current_path}"
bind b break-pane
bind B break-pane -d
bind J choose-tree -Z "join-pane -h -t %%"
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -hf -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -vf -c "#{pane_current_path}"

# Swapping
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1
bind -r '{' swap-pane -U
bind -r '}' swap-pane -D
bind -r ' ' next-layout


# -----------------------------------------------------------------------------
# > Custom bindings
# -----------------------------------------------------------------------------

# Popups and menus

# Keybinding cheatsheet
bind ? display-popup -E -w 76 -h 30 -T " keys " "less -R ~/.config/tmux/keys.txt"

# Session switcher: 0-9 select like choose-tree, current marked with *.
# Names are padded since display-menu sizes itself to its widest item.
bind s run-shell -C "display-menu -x C -y '##{e|+:##{popup_status_line_y},4}' -T '#[align=centre] Sessions ' \
    #{S:'#{p24:session_name}#{p-3:session_windows}w #{?#{==:#{session_name},#{client_session}},*, }' \
        '#{?#{e|<:#{loop_index},10},#{loop_index},}' 'switch-client -t =#{session_name}' }"

# Accent colour picker (see Status Bar); the choice is saved to tmux.conf.local
bind M-c display-menu -T "#[align=centre] Accent " \
    "#[fg=themewhite]██#[default] Neutral #{?#{==:#{@accentColor},themewhite},✓,}"       n "run-shell '~/.config/tmux/accent themewhite'" \
    "#[fg=themered]██#[default] Red #{?#{==:#{@accentColor},themered},✓,}"               r "run-shell '~/.config/tmux/accent themered'" \
    "#[fg=themegreen]██#[default] Green #{?#{==:#{@accentColor},themegreen},✓,}"         g "run-shell '~/.config/tmux/accent themegreen'" \
    "#[fg=themeyellow]██#[default] Yellow #{?#{==:#{@accentColor},themeyellow},✓,}"      y "run-shell '~/.config/tmux/accent themeyellow'" \
    "#[fg=themeblue]██#[default] Blue #{?#{==:#{@accentColor},themeblue},✓,}"            b "run-shell '~/.config/tmux/accent themeblue'" \
    "#[fg=thememagenta]██#[default] Magenta #{?#{==:#{@accentColor},thememagenta},✓,}"   m "run-shell '~/.config/tmux/accent thememagenta'" \
    "#[fg=themecyan]██#[default] Cyan #{?#{==:#{@accentColor},themecyan},✓,}"            c "run-shell '~/.config/tmux/accent themecyan'"

# Prompts

# Send the same command to all panes (C-a) or all panes in this session (C-s)
bind C-a command-prompt -p "Command:" \
    "run \"tmux list-panes -a -F '##{session_name}:##{window_index}.##{pane_index}' \
        | xargs -I PANE tmux send-keys -t PANE '%1' Enter\""
bind C-s command-prompt -p "Command:" \
    "run \"tmux list-panes -s -F '##{session_name}:##{window_index}.##{pane_index}' \
        | xargs -I PANE tmux send-keys -t PANE '%1' Enter\""

# Enter copy mode and search up
bind f copy-mode\; command-prompt -p "(search up)" "send -X search-backward '%%%'"

# Toggles

bind M if-shell 'test #{mouse} -gt 0' 'set -g mouse off' 'set -g mouse on'


# -----------------------------------------------------------------------------
# > Status Bar
# -----------------------------------------------------------------------------
# https://github.com/tmux/tmux/wiki/Formats

# Accent is a theme colour name (see Theme colours below). The default,
# themewhite, is the neutral text colour, so badges show inverted.
# Pick another with prefix M-c (see Custom bindings); the choice is saved to
# tmux.conf.local.
set -g @accentColor themewhite

# Badge text: bar colour on the neutral accent, background colour on coloured accents
set -g @badgeStyle "bg=#{@accentColor} fg=#{?#{==:#{@accentColor},themewhite},themedarkgrey,themeblack}"

set -g status on
set -g status-interval 10
set -g status-justify absolute-centre
set -g status-position top

# Window colors
set -g window-style "bg=themeblack dim"
set -g window-active-style "bg=themeblack"

# Status line
set -g status-style "bg=themedarkgrey fg=themewhite"
set -g message-style "#{E:@badgeStyle}"
set -g message-command-style "bg=themedarkgrey fg=themewhite"
set -g mode-style "bg=themedarkgrey" # mode is selection

badge_host="#[#{E:@badgeStyle}] #{=15:host_short} #[default]"
badge_user="#[#{E:@badgeStyle}] $USER #[default]"
badge_sess="#[#{E:@badgeStyle}] #S #[default]"
badge_prefix="#{?client_prefix,#[#{E:@badgeStyle}] #{prefix} #[default] ,}"
badge_mouse="#{?mouse,#[#{E:@badgeStyle}] M #[default],}"
badge_zoom="#{?window_zoomed_flag,#[#{E:@badgeStyle}] Z #[default] ,}"
badge_activity="#{?window_activity_flag,#[#{E:@badgeStyle}] A #[default] ,}"
badge_bell="#{?window_bell_flag,#[#{E:@badgeStyle}] B #[default] ,}"
badge_silence="#{?window_silence_flag,#[#{E:@badgeStyle}] S #[default] ,}"

set -g status-left "$badge_host $badge_sess"
set -g status-right "$badge_prefix$badge_zoom$badge_mouse$badge_activity$badge_bell$badge_silence"
set -g status-left-length 32
set -g status-right-length 30

# Set window list colors
setw -g window-status-format '#[fg=#{@accentColor}]#I-#W#[default]'
setw -g window-status-current-format "#[#{E:@badgeStyle}] #I-#W #[default]"
# setw -g window-status-current-style overline
setw -g window-status-activity-style strikethrough
setw -g window-status-bell-style strikethrough

# Set pane colors
# set -g pane-border-style "fg=#{@accentColor}"

# Theme colours used by the status bar and built-in UI (popups, menus,
# borders, copy mode), from the One Half palette to match vim:
# https://github.com/sonph/onehalf
#   darkgrey = surface, white = text, lightgrey = border,
#   black = pane background (also text on accents)
set -s light-theme-dark-grey  "#e4e4e4"
set -s light-theme-white      "#383a42"
set -s light-theme-light-grey "#a0a1a7"
set -s light-theme-black      "#fafafa"
set -s light-theme-red        "#e45649"
set -s light-theme-green      "#50a14f"
set -s light-theme-yellow     "#c18401"
set -s light-theme-blue       "#0184bc"
set -s light-theme-magenta    "#a626a4"
set -s light-theme-cyan       "#0997b3"
set -s dark-theme-dark-grey   "#313640"
set -s dark-theme-white       "#dcdfe4"
set -s dark-theme-light-grey  "#5c6370"
set -s dark-theme-black       "#282c34"
set -s dark-theme-red         "#e06c75"
set -s dark-theme-green       "#98c379"
set -s dark-theme-yellow      "#e5c07b"
set -s dark-theme-blue        "#61afef"
set -s dark-theme-magenta     "#c678dd"
set -s dark-theme-cyan        "#56b6c2"

# Terminal.app doesn't report light/dark, so ask macOS on load, when a client
# attaches and when the terminal regains focus. Without `defaults` (not macOS),
# leave the theme option alone so tmux detects it from the terminal.
sync_theme="command -v defaults >/dev/null || exit 0; if defaults read -g AppleInterfaceStyle 2>/dev/null | grep -q Dark; then tmux set -g theme dark; else tmux set -g theme light; fi"
set-hook -g client-attached "run-shell -b '$sync_theme'"
set-hook -g client-focus-in "run-shell -b '$sync_theme'"
run-shell "$sync_theme"


# -----------------------------------------------------------------------------
# > Nesting sessions
# -----------------------------------------------------------------------------

# Idea is to turn off all key bindings and prefix handling on local session,
# so that all keystrokes are passed to inner/remote session
# From: https://github.com/samoshkin/tmux-config/blob/master/tmux/tmux.conf

bind -T root M-S  \
    set prefix None \;\
    set key-table off \;\
    set status off \;\
    if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
    bind -T off M-j next-window \;\
    bind -T off M-k previous-window \;\
    refresh-client -S \;\

bind -T off M-S \
    set -u prefix \;\
    set -u key-table \;\
    set status on \;\
    unbind -T off M-j \;\
    unbind -T off M-k \;\
    refresh-client -S \;\


# -----------------------------------------------------------------------------
# > Local customization
# -----------------------------------------------------------------------------

# Load local settings
if-shell '[[ -f "$XDG_CONFIG_HOME"/tmux/tmux.conf.local ]]' \
    'source "$XDG_CONFIG_HOME"/tmux/tmux.conf.local'

