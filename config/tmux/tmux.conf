# -----------------------------------------------------------------------------
# > Server options
# -----------------------------------------------------------------------------

# send copies to the outer terminal's clipboard
set -s set-clipboard on
if 'command -v pbcopy > /dev/null' "set -s copy-command 'pbcopy'"

# Lets tmux tell Shift+Enter apart from Enter and pass it on
set -s extended-keys on
set -s terminal-features[10] 'xterm*:extkeys'

# 24-bit color
set -s terminal-features[11] 'xterm*:RGB'

# focus events are requested from the terminal and passed through to
# applications running in tmux
set -s focus-events on


# -----------------------------------------------------------------------------
# > Global session options
# -----------------------------------------------------------------------------

set -g prefix \;
bind \; send-prefix

# Number windows and panes from 1 and automatically renumber
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# how long messages are displayed
set -g display-time 1000

# more scrollback
set -g history-limit 50000

# display a message instead of sending a bell on activity
set -g visual-activity on

# Lets notification and progress escape sequences through tmux to the outer terminal
set -g allow-passthrough on
set -g update-environment[term-program] TERM_PROGRAM


# -----------------------------------------------------------------------------
# > Window & pane options
# -----------------------------------------------------------------------------

set -g monitor-activity on
set -g mode-keys vi


# -----------------------------------------------------------------------------
# > Key bindings
# -----------------------------------------------------------------------------


# make detach a bit harder
unbind d
bind D detach-client

# Navigation
bind k previous-window
bind j next-window
bind o select-pane -t :.+
bind h select-pane -t :.-
bind L last-window
bind l if -F '#{||:#{window_zoomed_flag},#{==:#{window_panes},1}}' last-window last-pane

# Splitting
bind c new-window -c "#{pane_current_path}"
bind a new-window -ac "#{pane_current_path}"
bind b break-pane
bind B break-pane -d
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -hf -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -vf -c "#{pane_current_path}"

# Swapping
bind -r '{' swap-pane -U
bind -r '}' swap-pane -D
bind -r ' ' next-layout

# Misc
bind K kill-pane
bind r source-file ~/.config/tmux/tmux.conf\; display "Reloaded .tmux.conf"
bind C-l send-keys -R \; clear-history
bind * new-pane -x60% -y80%
bind e split-window -hb -l 35 -c "#{pane_current_path}" "sbar"

# toggles
bind z resize-pane -Z
bind M set -g mouse

# vi keys in copy mode: v to start, y to copy
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# Display interactive commands in floating panes
bind s new-pane -DE -O -x60% -y60% -X20% -Y20% \; choose-tree -Nhks
bind w new-pane -DE -O -x60% -y60% -X20% -Y20% \; choose-tree -Nhkw
bind J new-pane -DE -O -x60% -y80% -X20% -Y20% \; choose-tree -hk "join-pane -h -s %%"
bind C new-pane -DE -O -x60% -y60% -X20% -Y20% \; customize-mode -k
bind : new-pane -DE -O -x60% -y60% -X20% -Y20% \; command-prompt -P

# Searching
bind C-r copy-mode\; command-prompt -P -T search -p "(search up)" { send-keys -X search-backward -- "%%" }
bind C-s copy-mode\; command-prompt -P -T search -p "(search down)" { send-keys -X search-forward -- "%%" }

# resizing shortcuts
bind H resize-window -x 145
bind F resize-window -A


# -----------------------------------------------------------------------------
# > Theme colors
# -----------------------------------------------------------------------------

# Theme colours used by the status bar and built-in UI (popups, menus,
# borders, copy mode), from the One Half palette to match vim:
# https://github.com/sonph/onehalf
#   darkgrey = surface, white = text, lightgrey = border,
#   black = pane background (also text on accents)
set -s light-theme-dark-grey  "#e4e4e4"
set -s light-theme-white      "#383a42"
set -s light-theme-light-grey "#a0a1a7"
set -s light-theme-black      "#fafafa"
set -s light-theme-red        "#e45649"
set -s light-theme-green      "#50a14f"
set -s light-theme-yellow     "#c18401"
set -s light-theme-blue       "#0184bc"
set -s light-theme-magenta    "#a626a4"
set -s light-theme-cyan       "#0997b3"
set -s dark-theme-dark-grey   "#313640"
set -s dark-theme-white       "#dcdfe4"
set -s dark-theme-light-grey  "#5c6370"
set -s dark-theme-black       "#282c34"
set -s dark-theme-red         "#e06c75"
set -s dark-theme-green       "#98c379"
set -s dark-theme-yellow      "#e5c07b"
set -s dark-theme-blue        "#61afef"
set -s dark-theme-magenta     "#c678dd"
set -s dark-theme-cyan        "#56b6c2"

# Terminal.app workaround
# sync_theme="command -v defaults >/dev/null || exit 0; if defaults read -g AppleInterfaceStyle 2>/dev/null | grep -q Dark; then tmux set -g theme dark; else tmux set -g theme light; fi"
# set-hook -g client-attached "run-shell -b '$sync_theme'"
# set-hook -g client-focus-in "run-shell -b '$sync_theme'"
